<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabelas</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }

        th, td {
            border: 1px solid #000000;
            padding: 8px;
        }

        .cnome{
            background-color: aqua;
        }

        .cgrupo {
            background-color: yellow;
        }

    </style>
</head>
<body>
    <h1>Exercicio de Tabelas</h1>
    <table>

        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>João Silva</td>
            <td>M</td>
            <td>30</td>
            <td>Engenheiro</td>
        </tr>

        <tr>
            <td>Maria Souza</td>
            <td>F</td>
            <td>28</td>
            <td>Advogada</td>
        </tr>

        <tr>
            <td>Carlos Oliveira</td>
            <td>M</td>
            <td>35</td>
            <td>Médico</td>
        </tr>

        <tr>
            <td>Fernanda Lima</td>
            <td>F</td>
            <td>22</td>
            <td>Designer</td>
        </tr>

        <tr>
            <td>Ricardo Santos</td>
            <td>M</td>
            <td>27</td>
            <td>Programador</td>
        </tr>
    </table>
</body>
</html>
