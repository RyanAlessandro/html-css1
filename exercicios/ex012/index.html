<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
    <style>
        video{
            width: 560px;
            height: 360px;
            border-radius: 20px;
        }
        *{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    
    <video poster="img/9c2c440f-fab6-4a24-b1b4-d3cd758e64ee.png" controls autoplay loop>
        <source src="midia/meu-video.mp4.mp4" type="video/mp4">
        <source src="midia/meu-video.mkv.mkv" type="video/mkv">
        <source src="midia/meu-video.webm.webm" type="video/webm">
        <p>Sua navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>

    <hr>
    <h1>Inserindo um vídeo do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/eTP5PZ8NoeU?si=sKzLRuajtZLWvWSG" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
